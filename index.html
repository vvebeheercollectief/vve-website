function useLanguage() {
  const [lang, setLangRaw] = useState(() => localStorage.getItem('lang') || 'nl');
  const [translations, setTranslations] = useState({});
  const [loading, setLoading] = useState(false);

  const setLang = (code) => {
    setLangRaw(code);
    localStorage.setItem('lang', code);
    document.documentElement.lang = code;
    const langDef = LANGUAGES.find(l => l.code === code);
    document.documentElement.dir = langDef?.dir || 'ltr';
  };

  useEffect(() => {
    if (lang === 'nl') {
      document.documentElement.lang = 'nl';
      document.documentElement.dir = 'ltr';
      return;
    }
    if (translations[lang]) return;
    setLoading(true);
    fetch(`lang/${lang}.json`)
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        setTranslations(prev => ({ ...prev, [lang]: data }));
        setLoading(false);
      })
      .catch(() => {
        setLangRaw('nl');
        localStorage.setItem('lang', 'nl');
        document.documentElement.lang = 'nl';
        document.documentElement.dir = 'ltr';
        setLoading(false);
      });
  }, [lang]);

  const t = (section, key) => {
    const nlSec = NL[section];
    const transSec = lang === 'nl' ? nlSec : (translations[lang] ? translations[lang][section] : undefined);
    if (key === undefined) {
      // Eén-arg: geef het sectie-object terug met NL als basis, zodat nog niet
      // vertaalde (nieuwe) sleutels netjes terugvallen op het Nederlands.
      if (transSec && typeof transSec === 'object' && !Array.isArray(transSec) &&
          nlSec && typeof nlSec === 'object' && !Array.isArray(nlSec)) {
        return { ...nlSec, ...transSec };
      }
      return transSec !== undefined ? transSec : nlSec;
    }
    // Twee-arg: per sleutel met NL-terugval.
    const v = transSec ? transSec[key] : undefined;
    return v !== undefined ? v : (nlSec ? nlSec[key] : undefined);
  };

  const isRtl = LANGUAGES.find(l => l.code === lang)?.dir === 'rtl';

  return { lang, setLang, t, isRtl, loading };
}

function I({ name, size = 18, weight = 'regular', style = {}, className = '' }) {
  const cls = weight === 'duotone' ? `ph-duotone ph-${name}` :
              weight === 'fill' ? `ph-fill ph-${name}` :
              `ph ph-${name}`;
  return <i className={`${cls} ${className}`} style={{ fontSize: size, lineHeight: 1, ...style }} />;
}

function Photo({ src, alt, style = {}, children }) {
  return (
    <div className="photo" style={{ backgroundImage: `url(${src})`, ...style }} role="img" aria-label={alt}>
      {children}
    </div>
  );
}

function CountUp({ value, duration = 1800, delay = 0, threshold = 0.2 }) {
  const match = String(value).match(/^(\D*?)([\d.]+)(.*)$/);
  if (!match) return <>{value}</>;
  const prefix = match[1];
  const numStr = match[2];
  const suffix = match[3];
  const target = parseInt(numStr.replace(/\./g, ''), 10) || 0;
  const hasThousandSep = /\d\.\d{3}/.test(numStr);

  const [n, setN] = useState(0);
  const ref = useRef(null);

  useEffect(() => {
    let raf;
    let timer;
    let started = false;
    let startTs;

    const animate = () => {
      const step = (t) => {
        if (startTs == null) startTs = t;
        const p = Math.min(1, (t - startTs) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        setN(Math.round(eased * target));
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };

    const run = () => {
      if (started) return;
      started = true;
      if (delay > 0) timer = setTimeout(animate, delay);
      else animate();
    };

    const el = ref.current;
    let io;
    if (el && 'IntersectionObserver' in window) {
      io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { run(); io.disconnect(); } });
      }, { threshold });
      io.observe(el);
    } else {
      run();
    }
    return () => { if (raf) cancelAnimationFrame(raf); if (timer) clearTimeout(timer); if (io) io.disconnect(); };
  }, [target, duration, delay, threshold]);

  const formatted = hasThousandSep ? n.toLocaleString('nl-NL') : String(n);
  return <span ref={ref}>{prefix}{formatted}{suffix}</span>;
}

function Reveal({ children, className = '', style = {}, as = 'div', onClick, ...rest }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) { setShown(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold: 0.12 });
    io.observe(el);
    // Veiligheidsnet: content mag NOOIT onzichtbaar blijven hangen wanneer de
    // entree-transitie niet kan draaien (achtergrond-throttling of synthetische
    // render). Na ~1.6s forceren we de zichtbare eindtoestand.
    const safety = setTimeout(() => {
      setShown(true);
      if (parseFloat(getComputedStyle(el).opacity) < 0.05) {
        el.style.transition = 'none';
        el.style.opacity = '1';
        el.style.transform = 'none';
        el.style.filter = 'none';
      }
    }, 1600);
    return () => { io.disconnect(); clearTimeout(safety); };
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} onClick={onClick} className={`reveal ${shown ? 'in' : ''} ${className}`} style={style} {...rest}>
      {children}
    </Tag>
  );
}

function PkgCheck({ value }) {
  if (value === true) return <I name="check-circle" size={18} weight="fill" style={{ color: 'var(--teal-700)' }} />;
  if (value === false) return <I name="minus-circle" size={18} weight="regular" style={{ color: 'var(--border)' }} />;
  return <span style={{ fontSize: 13, fontWeight: 700, color: 'var(--navy)' }}>{value}</span>;
}

function LanguageSwitcher({ lang, setLang }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const current = LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];

  useEffect(() => {
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  return (
    <div className="lang-switcher" ref={ref}>
      <button className="lang-toggle" onClick={() => setOpen(!open)}>
        <span>{current.flag}</span>
        <span>{current.code.toUpperCase()}</span>
        <I name={open ? 'caret-up' : 'caret-down'} size={12} />
      </button>
      <div className={`lang-dropdown ${open ? 'open' : ''}`}>
        {LANGUAGES.map(l => (
          <button key={l.code} className={`lang-option ${l.code === lang ? 'active' : ''}`}
            onClick={() => { setLang(l.code); setOpen(false); }}>
            <span>{l.flag}</span>
            <span>{l.label}</span>
            <span className="lang-option-code">{l.code.toUpperCase()}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function MobileLangSwitcher({ lang, setLang }) {

          <h1 data-r="h1" style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:46, lineHeight:1.1, letterSpacing:'-0.01em', margin:'0 0 18px' }}>{w.title}</h1>
          <p style={{ fontFamily:"'Karla'", fontSize:17.5, lineHeight:1.65, color:'#59616B', margin:'0 auto', maxWidth:600 }}>{w.intro}</p>
        </div>
      </section>

      <section style={{ maxWidth:760, margin:'0 auto', padding:'80px 24px 50px' }}>
        <Reveal style={{ borderLeft:'2px solid #E4E9ED', marginLeft:14 }}>
          {w.steps.map((s, i) => (
            <div key={i} style={{ position:'relative', padding:'0 0 44px 46px' }}>
              <div style={{ position:'absolute', left:-13, top:0, width:24, height:24, borderRadius:'50%', background:'#4E6885', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:"'Jost'", fontSize:12, border:'4px solid #FFFFFF' }}>{i+1}</div>
              <div style={{ fontFamily:"'Jost'", fontSize:11, letterSpacing:'0.18em', textTransform:'uppercase', color:'#4E6885', marginBottom:8 }}>{s.when}</div>
              <h3 style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:23, margin:'0 0 8px' }}>{s.title}</h3>
              <p style={{ fontFamily:"'Karla'", fontSize:16, lineHeight:1.7, color:'#59616B', margin:0 }}>{s.text}</p>
            </div>
          ))}
        </Reveal>
      </section>

      <section style={{ maxWidth:1000, margin:'0 auto', padding:'20px 24px 90px' }}>
        <Reveal data-r="g3" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:22 }}>
          {w.geruststelling.map((g, i) => (
            <div key={i} style={{ background:'#F5F7F9', borderRadius:12, padding:'32px 34px' }}>
              <h3 style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:19, margin:'0 0 10px' }}>{g.t}</h3>
              <p style={{ fontFamily:"'Karla'", fontSize:15, lineHeight:1.65, color:'#68717C', margin:0 }}>{g.s}</p>
            </div>
          ))}
        </Reveal>
      </section>

      <section style={{ background:'linear-gradient(180deg,#232E3A 0%,#1A212A 100%)' }}>
        <Reveal style={{ maxWidth:820, margin:'0 auto', padding:'96px 24px 84px', textAlign:'center' }}>
          <div style={{ fontFamily:"'Jost'", fontSize:12, letterSpacing:'0.28em', textTransform:'uppercase', color:'#8AA1B8', marginBottom:16 }}>{w.slot.eyebrow}</div>
          <h2 data-r="h2" style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:36, letterSpacing:'-0.01em', color:'#F5F8FB', margin:'0 0 14px' }}>{w.slot.title}</h2>
          <p style={{ fontFamily:"'Karla'", fontSize:16.5, lineHeight:1.65, color:'#AEB8C3', margin:'0 auto 30px', maxWidth:520 }}>{w.slot.intro}</p>
          <span className="h-btnD2" onClick={() => setPage('offerte')} style={{ display:'inline-block', fontFamily:"'Jost'", fontWeight:400, fontSize:12.5, letterSpacing:'0.16em', textTransform:'uppercase', color:'#F7F9FB', background:'#4E6885', padding:'16px 36px', borderRadius:4, cursor:'pointer' }}>{w.slot.btn}</span>
          <div style={{ marginTop:24, fontFamily:"'Karla'", fontSize:14, color:'#8891A0' }}>{w.slot.note}</div>
        </Reveal>
      </section>
    </main>
  );
}
function OverOnsPage({ t, setPage }) {
  const o = t('overons_page');
  const kpis = t('kpis');
  return (
    <main>
      <section style={{ maxWidth:1000, margin:'0 auto', padding:'96px 24px 72px' }}>
        <Reveal data-r="split" style={{ display:'grid', gridTemplateColumns:'1.05fr 0.95fr', gap:60, alignItems:'center' }}>
          <div>
            <div style={{ fontFamily:"'Jost'", fontSize:12, letterSpacing:'0.24em', textTransform:'uppercase', color:'#4E6885', marginBottom:16 }}>{o.eyebrow}</div>
            <h1 data-r="h1" style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:40, lineHeight:1.15, letterSpacing:'-0.01em', margin:'0 0 22px' }}>{o.title}</h1>
            <p style={{ fontFamily:"'Karla'", fontSize:17, lineHeight:1.75, color:'#59616B', margin:'0 0 26px' }}>{o.intro}</p>
            <div style={{ display:'flex', gap:22, flexWrap:'wrap' }}>
              {o.bullets.map((b, i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:9 }}><span style={{ width:6, height:6, borderRadius:'50%', background:'#4E6885' }}></span><span style={{ fontFamily:"'Karla'", fontSize:14.5, fontWeight:600, color:'#3B4653' }}>{b}</span></div>
              ))}
            </div>
          </div>
          <div style={{ aspectRatio:'1/1', borderRadius:14, background:'linear-gradient(160deg,#EEF2F5,#D6DEE6)', display:'flex', alignItems:'flex-end', justifyContent:'flex-start', padding:22, boxShadow:'0 40px 80px -54px rgba(28,36,46,0.6)' }}>
            <span style={{ fontFamily:"'Jost'", fontSize:10.5, letterSpacing:'0.22em', textTransform:'uppercase', color:'#8A94A0' }}>{o.foto_label}</span>
          </div>
        </Reveal>
      </section>

      <section style={{ background:'#F5F7F9' }}>
        <Reveal data-r="g4" style={{ maxWidth:1000, margin:'0 auto', padding:'66px 24px', display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:32 }}>
          {kpis.map((k, i) => (
            <div key={i}>
              <div style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:38, color:'#1C242E' }}><CountUp value={k.v} /></div>
              <div style={{ fontFamily:"'Karla'", fontSize:14, color:'#7A828C', marginTop:6 }}>{k.l}</div>
            </div>
          ))}
        </Reveal>
      </section>

      <section data-r="secpad" style={{ maxWidth:820, margin:'0 auto', padding:'96px 24px' }}>
        <Reveal>
          <div style={{ fontFamily:"'Jost'", fontSize:12, letterSpacing:'0.24em', textTransform:'uppercase', color:'#4E6885', marginBottom:22 }}>{o.missie_eyebrow}</div>
          <p data-r="h2" style={{ fontFamily:"'Source Serif 4',serif", fontWeight:400, fontSize:34, lineHeight:1.3, letterSpacing:'-0.01em', color:'#1C242E', margin:'0 0 28px' }}>{o.missie}</p>
          <p style={{ fontFamily:"'Karla'", fontSize:17, lineHeight:1.75, color:'#59616B', margin:0 }}>{o.missie_text}</p>
        </Reveal>
      </section>

      <section style={{ background:'linear-gradient(180deg,#232E3A 0%,#1A212A 100%)' }}>
        <Reveal data-r="row" style={{ maxWidth:1000, margin:'0 auto', padding:'72px 24px', display:'flex', justifyContent:'space-between', alignItems:'center', gap:40, flexWrap:'wrap' }}>
          <h2 data-r="h2" style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:28, color:'#F5F8FB', margin:0 }}>{o.cta_title}</h2>
          <span className="h-btnD2" onClick={() => setPage('offerte')} style={{ fontFamily:"'Jost'", fontWeight:400, fontSize:12, letterSpacing:'0.16em', textTransform:'uppercase', color:'#F7F9FB', background:'#4E6885', padding:'15px 32px', borderRadius:4, cursor:'pointer', whiteSpace:'nowrap' }}>{o.cta_btn}</span>
        </Reveal>
      </section>
    </main>
  );
}
function OffertePage({ t }) { return <PageStub title="Offerte" />; }

/* ── Juridische pagina (volledige body volgt in T8) ── */
function LegalPage({ t, section }) {
  const p = t(section) || {};
  return (
    <main className="container" style={{ maxWidth:820, padding:'96px 24px', minHeight:'52vh' }}>
      <h1 style={{ fontFamily:"'Source Serif 4',serif", fontWeight:600, fontSize:40, color:'#1C242E', marginBottom:16 }}>{p.title}</h1>
      {p.intro && <p style={{ color:'#59616B', fontFamily:"'Karla'", lineHeight:1.7 }}>{p.intro}</p>}
    </main>
  );
}

/* ── App ── */
function App() {
  const { lang, setLang, t, isRtl } = useLanguage();
  const [page, setPage] = useState('home');
  const [showTop, setShowTop] = useState(false);

  useEffect(() => {
    const onScroll = () => setShowTop((window.pageYOffset || document.documentElement.scrollTop || 0) > 620);
    window.addEventListener('scroll', onScroll, { passive:true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  useEffect(() => {
    const titles = t('titles') || {};
    if (titles[page]) document.title = titles[page];
    try { window.scrollTo(0, 0); } catch (e) {}
  }, [page, lang]);

  const scrollTop = () => { try { window.scrollTo({ top:0, behavior:'smooth' }); } catch (e) { window.scrollTo(0,0); } };

  let view;
  if (page === 'diensten') view = <DienstenPage t={t} setPage={setPage} />;
  else if (page === 'pakketten') view = <PakkettenPage t={t} setPage={setPage} />;
  else if (page === 'werkwijze') view = <WerkwijzePage t={t} setPage={setPage} />;
  else if (page === 'overons') view = <OverOnsPage t={t} setPage={setPage} />;
  else if (page === 'offerte') view = <OffertePage t={t} />;
  else if (page === 'privacy') view = <LegalPage t={t} section="privacy_page" />;
  else if (page === 'voorwaarden') view = <LegalPage t={t} section="voorwaarden_page" />;
  else if (page === 'cookies') view = <LegalPage t={t} section="cookies_page" />;
  else view = <HomePage t={t} setPage={setPage} />;

  return (
    <>
      <SiteHeader page={page} setPage={setPage} lang={lang} setLang={setLang} t={t} isRtl={isRtl} />
      {view}
      <SiteFooter setPage={setPage} t={t} isRtl={isRtl} />
      {showTop && (
        <div onClick={scrollTop} aria-label="Terug naar boven" role="button" tabIndex={0} style={{ position:'fixed', right:22, bottom:96, zIndex:70, width:46, height:46, borderRadius:'50%', background:'#fff', border:'1px solid #DCE3E8', boxShadow:'0 14px 34px -14px rgba(28,36,46,0.4)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'#4E6885', fontSize:18 }}>↑</div>
      )}
      <MobileBar setPage={setPage} t={t} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
