<style>
:root {
  --navy: #2B3544;
  --navy-dark: #1E2530;
  --white: #FFFFFF;
  --gray-bg: #F0F2F5;
  --teal-900: #064E50;
  --teal-700: #0D7377;
  --teal-500: #14B8A6;
  --teal-300: #5EEAD4;
  --teal-100: #CCFBF1;
  --green: #059669;
  --amber: #D97706;
  --red: #DC2626;
  --muted: #64748B;
  --border: #E2E8F0;
  --font: 'DM Sans', system-ui, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  color: var(--navy);
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.55;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font-family: inherit; cursor: pointer; }
ul { list-style: none; padding: 0; }

/* Container */
.container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px; border-radius: 10px; font-size: 15px;
  font-weight: 600; border: 1px solid transparent;
  transition: all .15s ease; cursor: pointer;
  text-decoration: none; font-family: inherit; line-height: 1.2;
}
.btn-primary { background: var(--teal-700); color: white; }
.btn-primary:hover { background: var(--teal-900); }
.btn-secondary { background: transparent; color: var(--navy); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--teal-700); color: var(--teal-700); }
.btn-dark { background: var(--navy); color: white; }
.btn-dark:hover { background: var(--navy-dark); }
.btn-ghost-light { background: transparent; color: white; border-color: rgba(255,255,255,0.3); }
.btn-ghost-light:hover { border-color: white; }
.btn-lg { padding: 18px 28px; font-size: 16px; }
.btn-sm { padding: 10px 16px; font-size: 13px; }

/* Pill */
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--teal-100); color: var(--teal-900);
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; padding: 6px 12px; border-radius: 100px;
}
.pill-dark { background: rgba(255,255,255,0.1); color: white; }

/* Section helpers */
section { padding: 96px 0; }
.section-narrow { padding: 64px 0; }
.section-eyebrow {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--teal-700); margin-bottom: 16px;
}
.section-title {
  font-size: 40px; line-height: 1.1; font-weight: 700;
  letter-spacing: -0.02em; color: var(--navy); margin: 0 0 16px;
}
.section-sub {
  font-size: 18px; line-height: 1.5; color: var(--muted);
  max-width: 640px; margin: 0;
}

/* Stats */
.stat-num {
  font-size: 48px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--teal-700); line-height: 1;
}
.stat-label { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* Card */
.card {
  background: white; border: 1px solid var(--border);
  border-radius: 14px; padding: 28px; transition: all .2s ease;
}
.card-hover:hover {
  border-color: var(--teal-700); transform: translateY(-2px);
  box-shadow: 0 12px 32px -16px rgba(43, 53, 68, 0.18);
}

/* Photo */
.photo {
  background: var(--gray-bg); background-size: cover;
  background-position: center; position: relative; overflow: hidden;
}

/* Form */
.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 6px; color: var(--navy);
}
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-family: inherit; font-size: 14px;
  color: var(--navy); background: white; transition: border-color .15s ease;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--teal-700);
}
.field textarea { resize: vertical; min-height: 100px; }
.field-error { font-size: 12px; color: var(--red); margin-top: 4px; }

/* Site header */
.site-header {
  background: var(--white); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 50;
}
.site-header-inner {
  display: flex; align-items: center; gap: 32px; padding: 18px 0;
}
.site-logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 16px; letter-spacing: -0.01em;
  color: var(--navy); cursor: pointer; white-space: nowrap;
}
.site-logo img { width: 32px; height: 32px; }
.site-nav { display: flex; gap: 4px; align-items: center; }
.site-nav a {
  font-size: 14px; font-weight: 500; color: var(--navy);
  padding: 8px 14px; border-radius: 6px; transition: color .15s;
}
.site-nav a:hover { color: var(--teal-700); }
.site-nav a.active { color: var(--teal-700); font-weight: 600; }
.site-header-cta {
  margin-left: auto; display: flex; gap: 12px; align-items: center;
}
.site-header-phone {
  font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}

/* Mobile menu */
.mobile-toggle {
  display: none; background: none; border: none;
  font-size: 24px; color: var(--navy); padding: 4px;
}
.mobile-menu {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: white; z-index: 100; flex-direction: column;
  padding: 24px 32px;
}
.mobile-menu.open { display: flex; }
.mobile-menu-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px;
}
.mobile-menu-close {
  background: none; border: none; font-size: 24px;
  color: var(--navy); cursor: pointer;
}
.mobile-menu nav { display: flex; flex-direction: column; gap: 4px; }
.mobile-menu nav a {
  font-size: 18px; font-weight: 500; color: var(--navy);
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.mobile-menu nav a.active { color: var(--teal-700); font-weight: 600; }
.mobile-menu .mobile-cta {
  margin-top: 32px; display: flex; flex-direction: column; gap: 12px;
}

/* Footer */
.site-footer {
  background: var(--navy); color: rgba(255,255,255,0.7);
  padding: 64px 0 32px;
}
.site-footer h4 {
  color: white; font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 18px;
}
.site-footer a { display: block; padding: 4px 0; font-size: 14px; transition: color .15s; }
.site-footer a:hover { color: white; }
.site-footer-grid {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 48px;
}
.site-footer-brand img { width: 40px; margin-bottom: 16px; }
.site-footer-brand p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; max-width: 320px; }
.site-footer-bottom {
  margin-top: 48px; padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex; justify-content: space-between; font-size: 12px;
  color: rgba(255,255,255,0.5); flex-wrap: wrap; gap: 12px;
}
.social-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,0.08);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.social-icon:hover { background: rgba(255,255,255,0.15); }

/* Responsive */
@media (max-width: 1023px) {
  .site-nav { display: none; }
  .site-header-phone { display: none; }
  .site-header-cta .btn { display: none; }
  .mobile-toggle { display: block; margin-left: auto; }
  .hero-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .hero-photo-col { order: -1; }
  .hero-stat-card { display: none; }
  .pillars-grid { grid-template-columns: 1fr 1fr !important; }
  .diff-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
  .testimonials-grid { grid-template-columns: 1fr 1fr !important; }
  .faq-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
  .cta-grid { grid-template-columns: 1fr !important; gap: 32px !important; padding: 40px !important; }
  .diensten-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .diensten-grid > div { direction: ltr !important; }
  .compleet-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .overons-header-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .stats-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
  .team-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .werkwijze-grid { grid-template-columns: 1fr !important; }
  .offerte-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .site-footer-grid { grid-template-columns: 1fr 1fr; }
  .trust-strip { gap: 24px !important; }
}

@media (max-width: 767px) {
  .container { padding: 0 16px; }
  section { padding: 64px 0; }
  .section-title { font-size: 28px; }
  .section-sub { font-size: 16px; }
  .hero-h1 { font-size: 36px !important; }
  .hero-sub { max-width: 100% !important; }
  .pillars-grid { grid-template-columns: 1fr !important; }
  .testimonials-grid { grid-template-columns: 1fr !important; }
  .diff-usps { grid-template-columns: 1fr !important; }
  .stats-grid-4 { grid-template-columns: repeat(2, 1fr) !important; gap: 24px !important; }
  .cta-grid { padding: 28px !important; }
  .cta-grid h2 { font-size: 28px !important; }
  .hero-stats { grid-template-columns: repeat(3, 1fr) !important; gap: 16px !important; }
  .hero-stats .stat-num { font-size: 32px !important; }
  .compleet-features { grid-template-columns: 1fr !important; }
  .offerte-services { grid-template-columns: 1fr !important; }
  .site-footer-grid { grid-template-columns: 1fr; gap: 32px; }
  .site-footer-bottom { flex-direction: column; text-align: center; }
  .page-h1 { font-size: 36px !important; }
  .btn-lg { padding: 14px 22px; font-size: 15px; }
  .trust-strip { flex-direction: column; align-items: flex-start !important; gap: 16px !important; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #c8cdd4; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #a4adb8; }
</style>

  return <i className={`${cls} ${className}`} style={{ fontSize: size, lineHeight: 1, ...style }} />;

    { num: '04', title: 'Inrichting klantenportaal', desc: 'Alle eigenaren krijgen toegang tot hun eigen klantenportaal. Alle stukken, financiën en onderhoud — meteen inzichtelijk.' },
    { num: '05', title: 'Eerste ALV', desc: 'We organiseren uw eerste ALV onder ons beheer en stellen u uw vaste contactpersoon voor.' },
    { num: '06', title: 'Doorlopend beheer', desc: 'Vanaf dat moment regelen wij alles. U houdt regie via het portaal en ontvangt proactieve updates.' },
  ];
  return (
    <>
      <section style={{ background: 'var(--gray-bg)', padding: '64px 0' }}>
        <div className="container">
          <div className="section-eyebrow">Werkwijze</div>
          <h1 className="page-h1" style={{ fontSize: 52, fontWeight: 700, letterSpacing: '-0.025em', lineHeight: 1.1, margin: '0 0 16px', maxWidth: 720 }}>
            Van offerte tot doorlopend beheer
          </h1>
          <p style={{ fontSize: 18, color: 'var(--muted)', maxWidth: 640, lineHeight: 1.55 }}>
            Een complete overstap regelen we doorgaans in 6 tot 8 weken. Zo ziet dat eruit:
          </p>
        </div>
      </section>

      <section>
        <div className="container">
          <div className="werkwijze-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 32 }}>
            {steps.map(s => (
              <div key={s.num} style={{ padding: 32, borderTop: '2px solid var(--navy)' }}>
                <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: '0.05em', color: 'var(--teal-700)' }}>STAP {s.num}</div>
                <h3 style={{ fontSize: 22, fontWeight: 700, letterSpacing: '-0.01em', margin: '12px 0 12px' }}>{s.title}</h3>
                <p style={{ fontSize: 15, lineHeight: 1.6, color: 'var(--muted)', margin: 0 }}>{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      <CTABlock setPage={setPage} />
    </>
  );
}

/* ══════════════════════════════════════════════
   OFFERTE PAGE
   ══════════════════════════════════════════════ */
function OffertePage() {
  const [step, setStep] = useState(1);
  const [submitted, setSubmitted] = useState(false);
  const next = () => setStep(Math.min(4, step + 1));
  const back = () => setStep(Math.max(1, step - 1));

  if (submitted) {
    return (
      <section style={{ padding: '96px 0', background: 'var(--gray-bg)', minHeight: 500 }}>
        <div className="container" style={{ maxWidth: 640, textAlign: 'center' }}>
          <div style={{ width: 64, height: 64, borderRadius: 32, background: 'var(--teal-100)', color: 'var(--teal-700)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 24 }}>
            <I name="check-circle" size={32} weight="fill" />
          </div>
          <h1 style={{ fontSize: 36, fontWeight: 700, margin: '0 0 16px' }}>Bedankt voor uw aanvraag</h1>
          <p style={{ fontSize: 17, color: 'var(--muted)', lineHeight: 1.6 }}>
            Wij hebben uw offerteaanvraag ontvangen en nemen binnen 2 werkdagen contact met u op.
          </p>
        </div>
      </section>
    );
  }

  return (
    <section style={{ padding: '64px 0 96px', background: 'var(--gray-bg)', minHeight: 700 }}>
      <div className="container" style={{ maxWidth: 1080 }}>
        <div className="offerte-grid" style={{ display: 'grid', gridTemplateColumns: '1fr 1.5fr', gap: 56 }}>
          <div>
            <div className="section-eyebrow">Offerte aanvragen</div>
            <h1 style={{ fontSize: 40, fontWeight: 700, letterSpacing: '-0.02em', lineHeight: 1.15, margin: '0 0 20px' }}>
              Vrijblijvend & op maat van uw VvE
            </h1>
            <p style={{ fontSize: 15, color: 'var(--muted)', lineHeight: 1.6, marginBottom: 32 }}>
              Vul het formulier in. Binnen 2 werkdagen ontvangt u een offerte op maat — telefonisch
              afgestemd zodat hij echt past bij uw situatie.
            </p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              {[
                ['shield-check', 'Vrijblijvend & gratis'],
                ['clock', 'Binnen 2 werkdagen reactie'],
                ['user-circle', 'Direct contact met een beheerder'],
                ['lock', 'Uw gegevens blijven van u'],
              ].map(([ic, label]) => (
                <div key={label} style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                  <I name={ic} size={18} weight="duotone" style={{ color: 'var(--teal-700)' }} />
                  <span style={{ fontSize: 14 }}>{label}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="card" style={{ padding: 36 }}>
            <div style={{ display: 'flex', gap: 8, marginBottom: 28 }}>
              {[1,2,3,4].map(n => (
                <div key={n} style={{ flex: 1, height: 4, borderRadius: 4, background: n <= step ? 'var(--teal-700)' : 'var(--border)' }} />
              ))}
            </div>
            <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 6 }}>Stap {step} van 4</div>
            <h3 style={{ fontSize: 22, fontWeight: 700, margin: '0 0 24px' }}>
              {step === 1 && 'Vertel ons over uw VvE'}
              {step === 2 && 'Welke diensten zoekt u?'}
              {step === 3 && 'Uw huidige situatie'}
              {step === 4 && 'Uw contactgegevens'}
            </h3>

            {step === 1 && (
              <>
                <div className="field"><label>Naam van de VvE</label><input placeholder="bv. VvE Parkzicht" /></div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                  <div className="field"><label>Aantal appartementen</label><input type="number" placeholder="bv. 24" /></div>
                  <div className="field"><label>Bouwjaar</label><input type="number" placeholder="bv. 1998" /></div>
                </div>
                <div className="field"><label>Adres / locatie</label><input placeholder="Plaats" /></div>
              </>
            )}

            {step === 2 && (
              <div className="offerte-services" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                {[
                  ['package', 'Compleetpakket', 'Alle 3 pijlers in één prijs'],
                  ['folders', 'Administratief', 'ALV, notulen, post'],
                  ['chart-line-up', 'Financieel', 'Boekhouding, jaarrekening'],
                  ['wrench', 'Technisch', 'MJOP, onderhoud'],
                ].map(([ic, t, d]) => (
                  <label key={t} style={{ display: 'block', padding: 18, border: '1.5px solid var(--border)', borderRadius: 10, cursor: 'pointer', transition: 'border-color .15s' }}>
                    <input type="checkbox" style={{ marginBottom: 10 }} />
                    <I name={ic} size={22} weight="duotone" style={{ color: 'var(--teal-700)', display: 'block', marginBottom: 8 }} />
                    <div style={{ fontSize: 14, fontWeight: 700 }}>{t}</div>
                    <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 2 }}>{d}</div>
                  </label>
                ))}
              </div>
            )}

            {step === 3 && (
              <>
                <div className="field"><label>Heeft u nu al een beheerder?</label>
                  <select><option>Ja, ik wil overstappen</option><option>Nee, voor het eerst</option><option>Zelfbeheer, we zoeken hulp</option></select>
                </div>
                <div className="field"><label>Wat is voor u het belangrijkst?</label>
                  <textarea placeholder="bv. snellere reactie, betere transparantie, lagere kosten…" />
                </div>
              </>
            )}

            {step === 4 && (
              <>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                  <div className="field"><label>Voornaam</label><input /></div>
                  <div className="field"><label>Achternaam</label><input /></div>
                </div>
                <div className="field"><label>Functie binnen VvE</label>
                  <select><option>Voorzitter</option><option>Penningmeester</option><option>Secretaris</option><option>Bestuurslid</option><option>Eigenaar / lid</option></select>
                </div>
                <div className="field"><label>E-mail</label><input type="email" /></div>
                <div className="field"><label>Telefoonnummer</label><input type="tel" /></div>
              </>
            )}

            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 24 }}>
              <button className="btn btn-secondary" onClick={back} disabled={step === 1} style={{ opacity: step === 1 ? 0.4 : 1 }}>
                <I name="arrow-left" size={14} /> Terug
              </button>
              {step < 4 ? (
                <button className="btn btn-primary" onClick={next}>Volgende stap <I name="arrow-right" size={14} /></button>
              ) : (
                <button className="btn btn-primary" onClick={() => setSubmitted(true)}>Aanvraag versturen <I name="paper-plane-tilt" size={14} /></button>
              )}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ══════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════ */
function App() {
  const [page, setPageRaw] = useState('home');

  const setPage = (p) => {
    setPageRaw(p);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  useEffect(() => {
    const titles = {
      home: 'VvE Beheer Collectief — VvE-beheer Zuid-Holland',
      diensten: 'Diensten — VvE Beheer Collectief',
      overons: 'Over ons — VvE Beheer Collectief',
      werkwijze: 'Werkwijze — VvE Beheer Collectief',
      offerte: 'Offerte aanvragen — VvE Beheer Collectief',
    };
    document.title = titles[page] || titles.home;
  }, [page]);

  return (
    <>
      <SiteHeader page={page} setPage={setPage} />
      {page === 'home' && <HomePage setPage={setPage} />}
      {page === 'diensten' && <DienstenPage setPage={setPage} />}
      {page === 'overons' && <OverOnsPage setPage={setPage} />}
      {page === 'werkwijze' && <WerkwijzePage setPage={setPage} />}
      {page === 'offerte' && <OffertePage />}
      <SiteFooter setPage={setPage} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
