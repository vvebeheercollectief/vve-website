<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="VvE Beheer Collectief — Persoonlijk, transparant en betrouwbaar VvE-beheer voor Zuid-Holland. 17+ jaar ervaring, 500+ VvE's in beheer." />
<title>VvE Beheer Collectief — VvE-beheer Zuid-Holland</title>
<link rel="icon" href="assets/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
:root {
  --navy: #2B3544;
  --navy-dark: #1E2530;
  --white: #FFFFFF;
  --gray-bg: #F0F2F5;
  --teal-900: #064E50;
  --teal-700: #0D7377;
  --teal-500: #14B8A6;
  --teal-300: #5EEAD4;
  --teal-100: #CCFBF1;
  --green: #059669;
  --amber: #D97706;
  --red: #DC2626;
  --muted: #64748B;
  --border: #E2E8F0;
  --teal-50: #EAF7F5;
  --ink: #404B5A;
  --border-2: rgba(43,53,68,0.08);
  --sh-sm: 0 2px 8px rgba(43,53,68,0.05);
  --sh-md: 0 18px 40px -24px rgba(43,53,68,0.28);
  --sh-lg: 0 40px 80px -44px rgba(43,53,68,0.40);
  --font: 'DM Sans', system-ui, Arial, sans-serif;
  --font-serif: Georgia, 'Times New Roman', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  color: var(--navy);
  background: var(--white);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.55;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font-family: inherit; cursor: pointer; }
ul { list-style: none; padding: 0; }

/* Container */
.container { max-width: 1320px; margin: 0 auto; padding: 0 32px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 22px; border-radius: 10px; font-size: 15px;
  font-weight: 600; border: 1px solid transparent;
  transition: all .15s ease; cursor: pointer;
  text-decoration: none; font-family: inherit; line-height: 1.2;
}
.btn-primary { background: var(--teal-700); color: white; }
.btn-primary:hover { background: var(--teal-900); }
.btn-secondary { background: transparent; color: var(--navy); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--teal-700); color: var(--teal-700); }
.btn-dark { background: var(--navy); color: white; }
.btn-dark:hover { background: var(--navy-dark); }
.btn-ghost-light { background: transparent; color: white; border-color: rgba(255,255,255,0.3); }
.btn-ghost-light:hover { border-color: white; }
.btn-lg { padding: 18px 28px; font-size: 16px; }
.btn-sm { padding: 10px 16px; font-size: 13px; }

/* Pill */
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--teal-100); color: var(--teal-900);
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; padding: 6px 12px; border-radius: 100px;
}
.pill-dark { background: rgba(255,255,255,0.1); color: white; }

/* Section helpers */
section { padding: 96px 0; }
.section-narrow { padding: 64px 0; }
.section-eyebrow {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--teal-700); margin-bottom: 16px;
}
.section-title {
  font-size: 40px; line-height: 1.1; font-weight: 700;
  letter-spacing: -0.02em; color: var(--navy); margin: 0 0 16px;
}
.section-sub {
  font-size: 18px; line-height: 1.5; color: var(--muted);
  max-width: 640px; margin: 0;
}

/* Stats */
.stat-num {
  font-size: 48px; font-weight: 800; letter-spacing: -0.03em;
  color: var(--teal-700); line-height: 1;
}
.stat-label { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* Card */
.card {
  background: white; border: 1px solid var(--border);
  border-radius: 14px; padding: 28px; transition: all .2s ease;
}
.card-hover:hover {
  border-color: var(--teal-700); transform: translateY(-2px);
  box-shadow: 0 12px 32px -16px rgba(43, 53, 68, 0.18);
}

/* Photo */
.photo {
  background: var(--gray-bg); background-size: cover;
  background-position: center; position: relative; overflow: hidden;
}

/* Form */
.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 13px; font-weight: 600;
  margin-bottom: 6px; color: var(--navy);
}
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-family: inherit; font-size: 14px;
  color: var(--navy); background: white; transition: border-color .15s ease;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--teal-700);
}
.field textarea { resize: vertical; min-height: 100px; }
.field-error { font-size: 12px; color: var(--red); margin-top: 4px; }

/* Site header — light glass variant.
   --hdr (0→1) stuurt de glas-vulling. Default 1 = altijd gevuld (desktop,
   overige pagina's, en de no-JS fallback). Op de mobiele home-hero zet JS
   --hdr op de scroll-voortgang zodat de balk geleidelijk meevult. */
.site-header {
  --hdr: 1;
  background: rgba(251,252,253,0.8);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
  position: sticky; top: 0; z-index: 50;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.site-logo-name { transition: opacity .2s ease; }
.site-header.scrolled {
  border-bottom-color: var(--border);
  box-shadow: 0 1px 0 rgba(43,53,68,0.02), 0 8px 24px -18px rgba(43,53,68,0.35);
}
.site-header-inner {
  display: flex; align-items: center; gap: 24px; padding: 18px 0;
}
.site-logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 16px; letter-spacing: -0.01em;
  color: var(--navy); cursor: pointer; white-space: nowrap;
}
.site-logo img { width: 32px; height: 32px; }
.site-nav { display: flex; gap: 2px; align-items: center; }
.site-nav a {
  font-size: 14px; font-weight: 500; color: var(--ink);
  padding: 9px 15px; border-radius: 999px; transition: all .15s ease;
  white-space: nowrap;
}
.site-nav a:hover { background: rgba(13,115,119,0.06); color: var(--teal-900); }
.site-nav a.active { background: var(--navy); color: #fff; font-weight: 600; }
.site-header-cta {
  margin-left: auto; display: flex; gap: 12px; align-items: center;
}
.site-header-phone {
  font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
}

/* Mobile menu */
.mobile-toggle {
  display: none; background: none; border: none;
  font-size: 24px; color: var(--navy); padding: 4px;
}
.mobile-menu {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: white; z-index: 100; flex-direction: column;
  padding: 24px 32px;
}
.mobile-menu.open { display: flex; }
.mobile-menu-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px;
}
.mobile-menu-close {
  background: none; border: none; font-size: 24px;
  color: var(--navy); cursor: pointer;
}
.mobile-menu nav { display: flex; flex-direction: column; gap: 4px; }
.mobile-menu nav a {
  font-size: 18px; font-weight: 500; color: var(--navy);
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.mobile-menu nav a.active { color: var(--teal-700); font-weight: 600; }
.mobile-menu .mobile-cta {
  margin-top: 32px; display: flex; flex-direction: column; gap: 12px;
}

/* Footer */
.site-footer {
  background: var(--navy); color: rgba(255,255,255,0.7);
  padding: 64px 0 32px;
}
.site-footer h4 {
  color: white; font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 18px;
}
.site-footer a { display: block; padding: 4px 0; font-size: 14px; transition: color .15s; }
.site-footer a:hover { color: white; }
.site-footer-grid {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 48px;
}
.site-footer-brand img { width: 40px; margin-bottom: 16px; }
.site-footer-brand p { font-size: 14px; line-height: 1.6; margin: 0 0 16px; max-width: 320px; }
.site-footer-bottom {
  margin-top: 48px; padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex; justify-content: space-between; font-size: 12px;
  color: rgba(255,255,255,0.5); flex-wrap: wrap; gap: 12px;
}
.social-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,0.08);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.social-icon:hover { background: rgba(255,255,255,0.15); }

/* Language switcher */
.lang-switcher {
  position: relative;
}
.lang-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  background: #fff; border: 1px solid var(--border);
  color: var(--navy); font-size: 13px; font-weight: 600;
  padding: 7px 12px; border-radius: 8px; cursor: pointer;
  font-family: inherit; transition: all .15s ease;
  white-space: nowrap;
}
.lang-toggle:hover { border-color: var(--teal-700); color: var(--teal-900); }
.lang-dropdown {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: white; border: 1px solid var(--border);
  border-radius: 12px; box-shadow: 0 16px 40px -12px rgba(43,53,68,0.25);
  min-width: 200px; padding: 6px; z-index: 200;
  opacity: 0; pointer-events: none; transform: translateY(-4px);
  transition: all .15s ease;
}
.lang-dropdown.open { opacity: 1; pointer-events: all; transform: translateY(0); }
.lang-option {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px; cursor: pointer;
  font-size: 14px; color: var(--navy); transition: background .1s;
  border: none; background: none; width: 100%; text-align: left;
  font-family: inherit;
}
.lang-option:hover { background: var(--gray-bg); }
.lang-option.active { background: var(--teal-100); color: var(--teal-900); font-weight: 600; }
.lang-option-code { font-size: 11px; color: var(--muted); margin-left: auto; font-weight: 600; }

/* Mobile lang switcher */
.mobile-lang-switcher {
  padding-bottom: 20px; margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.mobile-lang-toggle {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 12px 16px; border-radius: 10px; font-size: 15px; font-weight: 600;
  border: 1px solid var(--border); background: white; color: var(--navy);
  cursor: pointer; font-family: inherit; transition: border-color .15s;
}
.mobile-lang-toggle:hover { border-color: var(--teal-700); }
.mobile-lang-grid {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
}
.mobile-lang-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: 8px; font-size: 13px;
  font-weight: 500; border: 1px solid var(--border);
  background: white; color: var(--navy); cursor: pointer;
  font-family: inherit; transition: all .15s;
}
.mobile-lang-btn:hover { border-color: var(--teal-700); }
.mobile-lang-btn.active {
  background: var(--teal-100); border-color: var(--teal-700);
  color: var(--teal-900); font-weight: 600;
}

/* RTL text support (Arabic) */
[dir="rtl"] .section-title,
[dir="rtl"] .section-sub,
[dir="rtl"] .section-eyebrow,
[dir="rtl"] p,
[dir="rtl"] li,
[dir="rtl"] label,
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] h4,
[dir="rtl"] .card,
[dir="rtl"] .field input,
[dir="rtl"] .field textarea,
[dir="rtl"] .field select {
  text-align: right;
  direction: rtl;
}
[dir="rtl"] .site-footer a,
[dir="rtl"] .mobile-menu nav a {
  text-align: right;
}

/* Responsive */
/* Header collapses to hamburger earlier than the content grids, so the
   navy bar never gets cramped on mid-width screens. */
@media (max-width: 1099px) {
  .site-nav { display: none; }
  .site-header-phone { display: none; }
  .lang-switcher { display: none; }
  .site-header-cta .btn { display: none; }
  .mobile-toggle { display: block; margin-left: auto; font-size: 28px !important; padding: 8px !important; }
}

@media (max-width: 1023px) {
  .lang-switcher { display: none; }
  .site-nav { display: none; }
  .site-header-phone { display: none; }
  .site-header-cta .btn { display: none; }
  .mobile-toggle { display: block; margin-left: auto; font-size: 28px !important; padding: 8px !important; }
  .site-header-inner { padding: 16px 0 !important; }
  .hero-stats-bar { grid-template-columns: repeat(2, 1fr) !important; gap: 20px !important; padding: 24px 28px !important; }
  .pillars-grid { grid-template-columns: 1fr 1fr !important; }
  .diff-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
  .testimonials-grid { grid-template-columns: 1fr 1fr !important; }
  .faq-grid { grid-template-columns: 1fr !important; gap: 48px !important; }
  .cta-grid { grid-template-columns: 1fr !important; gap: 32px !important; padding: 40px !important; }
  .diensten-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .diensten-grid > div { direction: ltr !important; }
  .compleet-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .overons-header-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .stats-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
  .team-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .werkwijze-grid { grid-template-columns: 1fr !important; }
  .offerte-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .site-footer-grid { grid-template-columns: 1fr 1fr; }
  .trust-strip { gap: 24px !important; }
  .pakketten-cards { grid-template-columns: 1fr !important; }
  .pakketten-cards > div:last-child { transform: none !important; }
  .matrix-grid { font-size: 13px !important; }
  .hulp-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
  .hulp-cards { grid-template-columns: 1fr 1fr !important; }
}

/* Mobiele "glas"-header die meevult bij scrollen — alleen op de home-hero.
   Op overige mobiele pagina's blijft --hdr op 1 (gevuld). */
@media (max-width: 900px) {
  .site-header.is-home {
    background: rgba(251,252,253, calc(var(--hdr) * 0.92));
    -webkit-backdrop-filter: blur(calc(var(--hdr) * 14px)); backdrop-filter: blur(calc(var(--hdr) * 14px));
    border-bottom-color: rgba(43,53,68, calc(var(--hdr) * 0.08));
    box-shadow: none;
  }
  .site-header.is-home .site-logo-name { opacity: var(--hdr); }
}

@media (max-width: 767px) {
  .container { padding: 0 16px; }
  section { padding: 64px 0; }
  .section-title { font-size: 28px; }
  .section-sub { font-size: 16px; }
  .site-logo { font-size: 15px !important; }
  .site-logo img { width: 30px !important; height: 30px !important; }
  .hero-h1 { font-size: 36px !important; }
  .hero-sub { max-width: 100% !important; }
  .hero-buttons { flex-direction: column !important; }
  .hero-buttons .btn { width: 100% !important; justify-content: center; }
  .hero-skyline { display: none !important; }
  .hero-content { padding: 48px 16px 80px !important; min-height: auto !important; }
  .hero-bg {
    background:
      radial-gradient(ellipse 80% 70% at 60% 80%, rgba(13,115,119,0.18) 0%, rgba(13,115,119,0) 60%),
      radial-gradient(ellipse 70% 60% at 30% 20%, rgba(244,239,229,0.85) 0%, rgba(244,239,229,0) 70%),
      linear-gradient(150deg, #F6F2EA 0%, #E7EFEF 50%, #C5DBDC 100%) !important;
  }
  .hero-stats-wrapper .hero-stats-bar { margin-top: -28px !important; }
  .hero-stats-bar { grid-template-columns: 1fr 1fr !important; gap: 12px !important; padding: 16px !important; border-radius: 12px !important; }
  .hero-stat-item { border-left: none !important; background: var(--gray-bg); border-radius: 10px; padding: 12px 14px !important; }
  .hero-stats-bar .hero-stat-icon { width: 36px; height: 36px; border-radius: 10px; }
  .hero-stats-bar .stat-num { font-size: 24px !important; }
  .pillars-grid { grid-template-columns: 1fr !important; }
  .testimonials-grid { grid-template-columns: 1fr !important; }
  .diff-usps { grid-template-columns: 1fr !important; }
  .stats-grid-4 { grid-template-columns: repeat(2, 1fr) !important; gap: 24px !important; }
  .cta-grid { padding: 28px !important; }
  .cta-grid h2 { font-size: 28px !important; }
  .compleet-features { grid-template-columns: 1fr !important; }
  .offerte-services { grid-template-columns: 1fr !important; }
  .site-footer-grid { grid-template-columns: 1fr; gap: 32px; }
  .site-footer-bottom { flex-direction: column; text-align: center; }
  .page-h1 { font-size: 36px !important; }
  .btn-lg { padding: 14px 22px; font-size: 15px; }
  .trust-strip { flex-direction: column; align-items: flex-start !important; gap: 16px !important; }
  .pakketten-cards > div { padding: 28px !important; }
  .matrix-header, .matrix-row { grid-template-columns: 1.4fr 0.8fr 0.8fr 0.8fr !important; }
  .hulp-cards { grid-template-columns: 1fr !important; }
}

@media (max-width: 479px) {
  .hero-h1 { font-size: 32px !important; }
  .hero-stats-bar { grid-template-columns: 1fr 1fr !important; }
  .hero-stats-bar .stat-num { font-size: 22px !important; }
}

/* ════════════════════════════════════════════════════════════
   NIEUW ONTWERP — Hero (home), Diensten & Werkwijze (richting "Helder")
   ════════════════════════════════════════════════════════════ */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.22,1,.36,1), transform .7s cubic-bezier(.22,1,.36,1); }
.reveal.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

/* ── Hero ── */
.dz-hero { padding: 0; background: var(--white); }
.dz-panel {
  position: relative; overflow: hidden;
  border: 0; border-bottom: 1px solid var(--border-2);
  transform: translate3d(0,0,0);
  background:
    radial-gradient(60% 70% at 88% 96%, rgba(13,115,119,0.16) 0%, rgba(13,115,119,0) 60%),
    radial-gradient(46% 50% at 6% 6%, rgba(94,234,212,0.18) 0%, rgba(94,234,212,0) 62%),
    linear-gradient(155deg,#EEF5F4 0%, #F4F8F8 46%, #E9F2F1 100%);
}
/* Wrapper draagt positie + muis-parallax; de <img> draagt de entree-transform.
   Twee aparte elementen zodat de transforms elkaar nooit overschrijven. */
.dz-sky-wrap {
  position: absolute; bottom: 0; right: 0; width: min(46%,720px); max-height: 90%;
  z-index: 1; pointer-events: none;
  transform: translate3d(0,0,0);
  transition: transform .55s cubic-bezier(.22,1,.36,1);
  will-change: transform;
}
.dz-sky {
  display: block; width: 100%; height: 100%;
  object-fit: contain; object-position: bottom right;
  -webkit-mask-image: linear-gradient(to right,transparent 0%,#000 40%,#000 100%);
  mask-image: linear-gradient(to right,transparent 0%,#000 40%,#000 100%);
  filter: drop-shadow(0 12px 26px rgba(43,53,68,0.14));
}
.dz-hero-content { position: relative; z-index: 2; max-width: 600px; padding: clamp(48px,6vw,92px) 0; }
.dz-pill {
  display: inline-flex; align-items: center; gap: 8px; background: #fff;
  border: 1px solid var(--border); color: var(--teal-900); font-size: 12.5px;
  font-weight: 600; padding: 8px 15px; border-radius: 999px; box-shadow: var(--sh-sm); white-space: nowrap;
}
.dz-pill i { color: var(--teal-700); }
.dz-h1 { font-size: clamp(38px,5.4vw,64px); line-height: 1.06; font-weight: 800; letter-spacing: -0.03em; color: var(--navy); margin: 20px 0 22px; text-wrap: balance; }
.dz-h1 span { color: var(--teal-900); }
.dz-lead { font-size: clamp(16px,1.5vw,19px); line-height: 1.6; color: var(--ink); max-width: 460px; margin: 0 0 30px; }
.dz-ctas { display: flex; gap: 13px; flex-wrap: wrap; }
.dz-trust { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.dz-tchip { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.7); border: 1px solid var(--border-2); border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 600; color: var(--navy); }
.dz-tchip i { color: var(--teal-700); font-size: 17px; }
.dz-tt { display: inline; }
.dz-tt-num { white-space: nowrap; }

/* ── Hero entree-animatie (gestaffeld, op mount) ──
   Verborgen begintoestand geldt alléén met .dz-js (JS draait); zonder JS
   blijven elementen zichtbaar. .dz-in wordt op de panel gezet na mount. */
.dz-js .dz-panel .dz-anim {

function useLanguage() {
  const [lang, setLangRaw] = useState(() => localStorage.getItem('lang') || 'nl');
  const [translations, setTranslations] = useState({});
  const [loading, setLoading] = useState(false);

  const setLang = (code) => {
    setLangRaw(code);
    localStorage.setItem('lang', code);
    document.documentElement.lang = code;
    const langDef = LANGUAGES.find(l => l.code === code);
    document.documentElement.dir = langDef?.dir || 'ltr';
  };

  useEffect(() => {
    if (lang === 'nl') {
      document.documentElement.lang = 'nl';
      document.documentElement.dir = 'ltr';
      return;
    }
    if (translations[lang]) return;
    setLoading(true);
    fetch(`lang/${lang}.json`)
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        setTranslations(prev => ({ ...prev, [lang]: data }));
        setLoading(false);
      })
      .catch(() => {
        setLangRaw('nl');
        localStorage.setItem('lang', 'nl');
        document.documentElement.lang = 'nl';
        document.documentElement.dir = 'ltr';
        setLoading(false);
      });
  }, [lang]);

  const t = (section, key) => {
    const source = lang === 'nl' ? NL : (translations[lang] || NL);
    const val = source[section];
    if (val === undefined) return key ? NL[section]?.[key] : NL[section];
    if (key === undefined) return val;
    return val[key] !== undefined ? val[key] : NL[section]?.[key];
  };

  const isRtl = LANGUAGES.find(l => l.code === lang)?.dir === 'rtl';

  return { lang, setLang, t, isRtl, loading };
}

function CountUp({ value, duration = 1800, delay = 0, threshold = 0.2 }) {
  const match = String(value).match(/^(\D*?)([\d.]+)(.*)$/);
  if (!match) return <>{value}</>;
  const prefix = match[1];
  const numStr = match[2];
  const suffix = match[3];
  const target = parseInt(numStr.replace(/\./g, ''), 10) || 0;
  const hasThousandSep = /\d\.\d{3}/.test(numStr);

  const [n, setN] = useState(0);
  const ref = useRef(null);

  useEffect(() => {
    let raf;
    let timer;
    let started = false;
    let startTs;

    const animate = () => {
      const step = (t) => {
        if (startTs == null) startTs = t;
        const p = Math.min(1, (t - startTs) / duration);
        const eased = 1 - Math.pow(1 - p, 3);
        setN(Math.round(eased * target));
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };

    const run = () => {
      if (started) return;
      started = true;
      if (delay > 0) timer = setTimeout(animate, delay);
      else animate();
    };

    const el = ref.current;
    let io;
    if (el && 'IntersectionObserver' in window) {
      io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { run(); io.disconnect(); } });
      }, { threshold });
      io.observe(el);
    } else {
      run();
    }
    return () => { if (raf) cancelAnimationFrame(raf); if (timer) clearTimeout(timer); if (io) io.disconnect(); };
  }, [target, duration, delay, threshold]);

  const formatted = hasThousandSep ? n.toLocaleString('nl-NL') : String(n);
  return <span ref={ref}>{prefix}{formatted}{suffix}</span>;
}

function Reveal({ children, className = '', style = {}, as = 'div', onClick }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || !('IntersectionObserver' in window)) { setShown(true); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } });
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  const Tag = as;
  return (
    <Tag ref={ref} onClick={onClick} className={`reveal ${shown ? 'in' : ''} ${className}`} style={style}>
      {children}
    </Tag>
  );
}

function LanguageSwitcher({ lang, setLang }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const current = LANGUAGES.find(l => l.code === lang) || LANGUAGES[0];

  useEffect(() => {
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  return (
    <div className="lang-switcher" ref={ref}>
      <button className="lang-toggle" onClick={() => setOpen(!open)}>
        <span>{current.flag}</span>
        <span>{current.code.toUpperCase()}</span>
        <I name={open ? 'caret-up' : 'caret-down'} size={12} />
      </button>
      <div className={`lang-dropdown ${open ? 'open' : ''}`}>
        {LANGUAGES.map(l => (
          <button key={l.code} className={`lang-option ${l.code === lang ? 'active' : ''}`}
            onClick={() => { setLang(l.code); setOpen(false); }}>
            <span>{l.flag}</span>
            <span>{l.label}</span>
            <span className="lang-option-code">{l.code.toUpperCase()}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

  // (opacity:0) eerst getekend wordt en de transitie zichtbaar inkomt.
  useEffect(() => {

    return () => cancelAnimationFrame(r);
  }, []);

  // Skyline muis-parallax — alleen op apparaten met fijne aanwijzer + hover,
  // en niet bij prefers-reduced-motion. Parallax zit op de wrapper.
  useEffect(() => {
    const panel = panelRef.current, wrap = skyWrapRef.current;
    if (!panel || !wrap || !window.matchMedia) return;
    const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!fine || reduce) return;
    const onMove = (e) => {
      const r = panel.getBoundingClientRect();
      const dx = (e.clientX - r.left) / r.width - 0.5;
      const dy = (e.clientY - r.top) / r.height - 0.5;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      rafRef.current = requestAnimationFrame(() => {
        wrap.style.transform = `translate3d(${(dx * 18).toFixed(2)}px, ${(dy * 12).toFixed(2)}px, 0)`;
      });
    };
    const onLeave = () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      wrap.style.transform = 'translate3d(0,0,0)';
    };
    panel.addEventListener('mousemove', onMove);
    panel.addEventListener('mouseleave', onLeave);
    return () => {
      panel.removeEventListener('mousemove', onMove);
      panel.removeEventListener('mouseleave', onLeave);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, []);

  return (
    <section className="dz-hero">
      <div className={`dz-panel ${entered ? 'dz-in' : ''}`} ref={panelRef}>
        <div className="dz-sky-wrap" ref={skyWrapRef}>
          <img className="dz-sky" src={PHOTOS.skyline} alt="Den Haag skyline" />
        </div>
        <div className="container">
          <div className="dz-hero-content">
            <img className="dz-mob-icon dz-anim" src="assets/icoon-donker.png" alt="" />
            <span className="dz-pill dz-anim"><I name="house-line" size={15} weight="fill" /> {heroT.pill}</span>
            <h1 className="dz-h1 dz-anim">{heroT.title_1} <span>{heroT.title_2}</span></h1>
            <p className="dz-lead dz-anim">{heroT.subtitle}</p>
            <div className="dz-ctas dz-anim">
              <button className="btn btn-primary btn-lg" onClick={() => setPage('diensten')}>
                {heroT.cta_primary} <I name="arrow-right" size={16} />
              </button>
              <button className="btn btn-secondary btn-lg" onClick={() => setPage('werkwijze')}
                style={{ background: '#fff', borderColor: 'var(--border)' }}>
                {heroT.cta_secondary}
              </button>
            </div>
            <div className="dz-trust dz-anim">
              {trust.map((label, i) => (
                <span key={i} className="dz-tchip">
                  <I name={trustIcons[i] || 'check'} size={17} weight="duotone" />{' '}
                  <span className="dz-tt">
                    <span className="dz-tt-num">
                      <CountUp value={TRUST_NUMS[i]} duration={1200} delay={700} threshold={0.5} />

/* ══════════════════════════════════════════════
   WERKWIJZE PAGE
   ══════════════════════════════════════════════ */
function WerkwijzePage({ setPage, t, isRtl }) {
  const wp = t('werkwijze_page');
  const steps = wp.steps || [];
  const reassure = wp.reassure || [];
  const stepIcons = ['note-pencil', 'chats-circle', 'arrows-left-right', 'monitor', 'users-three', 'shield-check'];
  const reassureIcons = ['hand-palm', 'lock-key', 'user-circle-check'];
  const railRef = useRef(null);
  const fillRef = useRef(null);
  const stepRefs = useRef([]);

  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      stepRefs.current.forEach(el => el && el.classList.add('on'));
      if (fillRef.current) fillRef.current.style.height = '100%';
      return;
    }
    const onScroll = () => {
      const vh = window.innerHeight;
      stepRefs.current.forEach(el => {
        if (el) el.classList.toggle('on', el.getBoundingClientRect().top < vh * 0.55);
      });
      const rail = railRef.current, fill = fillRef.current;
      if (rail && fill) {
        const r = rail.getBoundingClientRect();
        const p = (vh * 0.5 - r.top) / (r.height || 1);
        fill.style.height = Math.max(0, Math.min(1, p)) * 100 + '%';
      }
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    return () => {
      window.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
    };
  }, [steps.length]);

  return (
    <>
      {/* Paginakop (gecentreerd) */}
      <section style={{ paddingBottom: 'clamp(28px,3vw,48px)' }}>
        <div className="container">
          <Reveal className="dz-head center">
            <span className="dz-eyebrow">{wp.eyebrow}</span>
            <h2>{wp.title_1} <span>{wp.title_2}</span></h2>
            <p>{wp.subtitle}</p>
          </Reveal>
        </div>
      </section>

      {/* Verticale tijdlijn + reassure */}
      <section style={{ paddingTop: 0 }}>
        <div className="container">
          <div className="dz-tl">
            <div className="dz-rail" ref={railRef}><div className="dz-rail-fill" ref={fillRef} /></div>
            {steps.map((s, idx) => (
              <div key={idx} className="dz-tstep" ref={el => { stepRefs.current[idx] = el; }}>
                <div className="dz-tnode"><I name={stepIcons[idx] || 'check'} size={24} weight="duotone" /></div>
                <div className="dz-tcard">
                  <div className="dz-tmeta">
                    <span className="dz-tnum">{wp.stap} 0{idx + 1}</span>
                    <span className="dz-twhen">{s.when}</span>
                  </div>
                  <h3>{s.title}</h3>
                  <p>{s.desc}</p>
                </div>
              </div>
            ))}
          </div>

          <div className="dz-reassure">
            {reassure.map((r, idx) => (
              <Reveal key={idx}>
                <I name={reassureIcons[idx] || 'check'} size={27} weight="duotone" />
                <b>{r.title}</b>
                <p>{r.desc}</p>
              </Reveal>
            ))}
          </div>
        </div>
      </section>

      {/* CTA */}
      <section style={{ paddingTop: 0 }}>
        <div className="container">
          <DzCTA data={wp} setPage={setPage} />
        </div>
      </section>
    </>
  );
}
